services:
  relay:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      # Not port 80, so it doesn't clash with x-ui / certificate renewal.
      - "${RELAY_PORT:-8080}:80"
    volumes:
      - ./navasan.conf:/etc/nginx/conf.d/default.conf:ro
      - ./htpasswd:/etc/nginx/htpasswd:ro
