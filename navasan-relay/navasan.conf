# Reverse proxy ("relay") for https://www.navasan.net
#
# Your browser talks only to this VPS; the VPS fetches navasan.net for you.
# Live prices come over a WebSocket at ws2.navasan.net, so that is relayed
# under /ws2/ and the page's JavaScript is rewritten to connect there.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # Password-protect the relay so it isn't an open proxy for strangers.
    auth_basic           "navasan relay";
    auth_basic_user_file /etc/nginx/htpasswd;

    proxy_http_version    1.1;
    proxy_ssl_server_name on;
    proxy_buffering       off;

    # Live price stream (WebSocket).
    location /ws2/ {
        proxy_pass         https://ws2.navasan.net/;
        proxy_ssl_name     ws2.navasan.net;
        proxy_set_header   Host ws2.navasan.net;
        proxy_set_header   Origin https://www.navasan.net;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Authorization "";
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # jQuery from its CDN, so the browser only ever needs to reach this VPS.
    location /_jquery/ {
        proxy_pass       https://code.jquery.com/;
        proxy_ssl_name   code.jquery.com;
        proxy_set_header Host code.jquery.com;
        proxy_set_header Authorization "";
    }

    # Everything else: pages, scripts, chart data, AJAX price updates.
    location / {
        proxy_pass       https://www.navasan.net;
        proxy_ssl_name   www.navasan.net;
        proxy_set_header Host www.navasan.net;
        proxy_set_header Referer https://www.navasan.net/;
        proxy_set_header Authorization "";
        # Ask for uncompressed responses so sub_filter can rewrite them.
        proxy_set_header Accept-Encoding "";

        # Keep redirects and cookies on the relay instead of the real site.
        proxy_redirect      https://www.navasan.net/ /;
        proxy_redirect      http://www.navasan.net/  /;
        proxy_cookie_domain ~\.?navasan\.net$ $host;

        sub_filter_once  off;
        sub_filter_types text/javascript application/javascript application/x-javascript text/css;

        # Point the live WebSocket at this relay (ws:// or wss:// to match the page).
        sub_filter "'wss://'+'ws2.navasan.net/'" "(location.protocol=='https:'?'wss://':'ws://')+location.host+'/ws2/'";
        # The site's request token is built from the page hostname; make it
        # use the real hostname so the site still accepts the requests.
        sub_filter "['hostname']" "['hostname'].replace(/.+/,'www.navasan.net')";
        sub_filter "window.location.host=='www.navasan.net'" "true";
        sub_filter "https://code.jquery.com/" "/_jquery/";
        # Refresh the price tables every 30 seconds instead of every 2 minutes.
        sub_filter "setInterval(function(){updateTable()},120000)" "setInterval(function(){updateTable()},30000)";
        # Keep links on the relay instead of jumping to the real site.
        sub_filter "https://www.navasan.net/" "/";
        sub_filter "//www.navasan.net/" "/";
    }
}
